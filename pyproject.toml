[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "share-trading-ai"
version = "0.1.0"
description = "Research, backtesting and paper-trading engine for Indian equities"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "yfinance>=0.2.54,<1",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
